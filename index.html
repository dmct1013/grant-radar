  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "#";
  const parse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3])) : null; };
  const todayD = parse(payload.today);
  const daysTo = s => { const d = parse(s); return d ? Math.round((d - todayD) / 86400000) : null; };
  const fmt = s => { const d = parse(s); return d ? `${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}` : "—"; };
  const TBD = "待確認";
  const known = v => v && v !== TBD;

  function identityOk(identities) { return state.identity === "all" || !identities || !identities.length || identities.includes(state.identity); }
  function catOk(c) { return state.category === "all" || c === state.category; }
  function grantOk(g) { const p = progById[g.program_id]; return catOk(g.category) && identityOk(p ? p.identities : null); }

  const row = (label, text) => known(text) ? `<p class="row"><b>${esc(label)}</b>${esc(text)}</p>` : "";

  function grantCard(g, opts) {
    const p = progById[g.program_id];
    const d = daysTo(g.deadline);
    let dayTag = "";
    if (opts.days && d !== null) dayTag = `<span class="tag days${d <= 14 ? " urgent" : ""}">${d === 0 ? "今天截止" : `剩 ${d} 天`}</span>`;
    const deadlineLine = g.bucket === "open" && g.deadline !== "unknown" ? `截止 ${fmt(g.deadline)}` : (g.bucket === "perennial" ? "常年受理" : "截止日待確認，請看原文");
    return `<article class="item">
      <div class="tags">${dayTag}<span class="tag">${esc(catLabel[g.category] || "其他")}</span>${g.source_stale ? '<span class="tag future">來源今日未更新</span>' : ""}</div>
      <h3>${esc(g.title)}</h3><p class="agency">${esc(g.agency)}</p>
      ${row("期限", deadlineLine)}
      ${row("金額", g.amount_text || (p && p.amount))}
      ${row("資格", g.eligibility_text || (p && p.who))}
      ${p ? row("適用", p.identities.join("、")) : ""}
      <div class="actions"><a class="btn" href="${esc(safeUrl(g.url))}" target="_blank" rel="noopener noreferrer">查看原始公告 →</a></div>
    </article>`;
  }

  function renderNow() {
    const list = grants.filter(g => g.bucket === "open" && grantOk(g)).sort((a, b) => (daysTo(a.deadline) ?? 9e9) - (daysTo(b.deadline) ?? 9e9));
    document.getElementById("now-list").innerHTML = list.length ? list.map(g => grantCard(g, { days: true })).join("") : `<div class="empty">目前沒有符合條件、截止日確定的公告。</div>`;
    return new Set(list.map(g => g.program_id).filter(Boolean));
  }

  function renderSoon(openPrograms) {
    const start = todayD.getUTCMonth() + 1;
    const months = Array.from({ length: 6 }, (_, i) => { const m = ((start - 1 + i) % 12) + 1; return { m, y: todayD.getUTCFullYear() + Math.floor((start - 1 + i) / 12) }; });
    const placed = new Set();
    let html = "";
    months.forEach(({ m, y }) => {
      const items = programs.filter(p => !placed.has(p.pid) && !openPrograms.has(p.pid) && p.months.includes(m) && catOk(p.category) && identityOk(p.identities));
      items.forEach(p => placed.add(p.pid));
      if (!items.length) return;
      html += `<div class="month">${y} 年 ${m} 月</div>` + items.map(p => `<article class="item">
        <div class="tags"><span class="tag future">往年時間，尚未公告</span><span class="tag">${esc(catLabel[p.category] || "其他")}</span></div>
        <h3>${esc(p.name)}</h3><p class="agency">${esc(p.agency)}</p>
        ${row("往年", p.window)}${row("金額", p.amount)}${row("自籌", p.self_funding)}${row("資格", p.who)}${row("適用", p.identities.join("、"))}
        <div class="actions"><a class="btn" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">官方頁面 →</a></div>
      </article>`).join("");
    });
    document.getElementById("soon-list").innerHTML = html || `<div class="empty">這個篩選條件下，未來六個月沒有已知的固定計畫。</div>`;
  }

  function renderFresh() {
    const list = grants.filter(g => !g.program_id && ["open", "unverified", "perennial"].includes(g.bucket) && grantOk(g)
      && (() => { const f = parse((g.first_seen || "").slice(0, 10)); return f && (todayD - f) / 86400000 <= 14; })())
      .sort((a, b) => String(b.first_seen).localeCompare(String(a.first_seen)));
    document.getElementById("fresh-list").innerHTML = list.length ? list.map(g => grantCard(g, { days: g.bucket === "open" })).join("") : `<div class="empty">最近 14 天沒有新的、且不屬於固定計畫的公告。</div>`;
  }

  const tabLead = { unverified: "公告裡讀不到可靠的截止日，請開啟原文確認。", perennial: "來源標示為常年受理，沒有固定截止日。", closed: "已截止或判定為過期的資料。" };
  function renderTab() {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
    document.getElementById("tab-lead").textContent = tabLead[state.tab];
    const list = grants.filter(g => g.bucket === state.tab && grantOk(g)).sort((a, b) => String(b.first_seen).localeCompare(String(a.first_seen)));
    const shown = list.slice(0, state.visible);
    document.getElementById("tab-list").innerHTML = shown.length ? shown.map(g => grantCard(g, { days: false })).join("") : `<div class="empty">這個分頁沒有資料。</div>`;
    const more = document.getElementById("tab-more");
    more.hidden = shown.length >= list.length;
    more.textContent = `顯示更多（尚有 ${list.length - shown.length} 筆）`;
  }

  function renderAll() { const open = renderNow(); renderSoon(open); renderFresh(); renderTab(); }

  function init() {
    const idSel = document.getElementById("f-identity");
    [...new Set(programs.flatMap(p => p.identities))].forEach(i => idSel.insertAdjacentHTML("beforeend", `<option value="${esc(i)}">${esc(i)}</option>`));
    document.getElementById("f-category").innerHTML = cats.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
    idSel.addEventListener("change", e => { state.identity = e.target.value; state.visible = 30; renderAll(); });
    document.getElementById("f-category").addEventListener("change", e => { state.category = e.target.value; state.visible = 30; renderAll(); });
    document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { state.tab = t.dataset.tab; state.visible = 30; renderTab(); }));
    document.getElementById("tab-more").addEventListener("click", () => { state.visible += 30; renderTab(); });
    const h = payload.health || {};
    const meta = [`資料更新於 ${fmt(payload.updated_at)} ${String(payload.updated_at || "").slice(11, 16)}`];
    if (h.available !== false && h.source_count) meta.push(`今日來源 ${h.success_count}/${h.source_count} 正常`);
    const stale = (todayD - parse(String(payload.updated_at).slice(0, 10))) / 86400000;
    const el = document.getElementById("meta");
    el.innerHTML = meta.map(m => `<span>${esc(m)}</span>`).join("") + (stale >= 2 ? `<span class="warn">資料已 ${stale} 天未更新</span>` : "");
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
